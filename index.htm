 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دندون</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    font-size:55px;
    color:#00ffcc;
    text-shadow:0 0 20px #00ffcc;
}

p{
    color:#ccc;
    font-size:20px;
    margin-bottom: 30px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:15px;
    background:#00ffcc;
    color:black;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    background:white;
}
</style>

</head>

<body>

<div class="container">
<h1>دندون</h1>
<p>أول عالم رقمي يعكس مزاجك وأفكارك</p>

<button onclick="showMessage()">
ابدأ الرحلة
</button>
</div>

<script>
function showMessage(){
    alert("أهلاً بك في عالم دندون الرقمي 😎");
}
</script>

</body>
</html>
